<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raw Planet mockups</title>
<style>
  :root { --bg:#f5f5f4; --ink:#1c1917; --line:#d6d3d1; --on:#1c1917; --onText:#fff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display:flex; flex-direction:column; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; padding:10px 16px;
    border-bottom:1px solid var(--line); background:#fff; }
  h1 { font-size:14px; margin:0 8px 0 0; font-weight:600; }
  nav { display:flex; flex-wrap:wrap; gap:6px; }
  nav button, .tools button, .tools a { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink);
    padding:6px 12px; border-radius:999px; cursor:pointer; text-decoration:none; }
  nav button[aria-pressed="true"] { background:var(--on); color:var(--onText); border-color:var(--on); }
  .tools { margin-left:auto; display:flex; gap:6px; }
  button:focus-visible, a:focus-visible { outline:2px solid #2563eb; outline-offset:2px; }
  main { flex:1; display:flex; justify-content:center; min-height:0; padding:0; }
  iframe { border:0; width:100%; height:100%; background:#fff; transition:width .2s; }
  main.mobile { padding:16px; }
  main.mobile iframe { width:390px; max-width:100%; border:1px solid var(--line); border-radius:12px; }
  @media (max-width:600px) { .tools { margin-left:0; } }
</style>
</head>
<body>
<header>
  <h1>Raw Planet: 4 directions</h1>
  <nav aria-label="Mockups">
    <button data-src="mockups/1-red-room/index.html">1. Red Room</button>
    <button data-src="mockups/2-orbit/index.html">2. Orbit</button>
    <button data-src="mockups/3-open-door/index.html">3. Open Door</button>
    <button data-src="mockups/4-set-times/index.html">4. Set Times</button>
  </nav>
  <div class="tools">
    <button id="size" aria-pressed="false">Phone width</button>
    <a id="newtab" href="#" target="_blank" rel="noopener">Open full page</a>
  </div>
</header>
<main id="stage"><iframe id="frame" title="Mockup preview"></iframe></main>
<script>
  const btns = [...document.querySelectorAll('nav button')];
  const frame = document.getElementById('frame'), newtab = document.getElementById('newtab');
  function show(i) {
    btns.forEach((b, j) => b.setAttribute('aria-pressed', i === j));
    frame.src = newtab.href = btns[i].dataset.src;
    try { localStorage.setItem('rp-mock', i); } catch (e) {}
  }
  btns.forEach((b, i) => b.addEventListener('click', () => show(i)));
  document.getElementById('size').addEventListener('click', e => {
    const on = document.getElementById('stage').classList.toggle('mobile');
    e.currentTarget.setAttribute('aria-pressed', on);
  });
  let start = 0; try { start = +localStorage.getItem('rp-mock') || 0; } catch (e) {}
  show(Math.min(start, 3));
</script>
</body>
</html>
